<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuzzy Washing Machine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tint"></i> Fuzzy Washing Machine Controller</h1>
            <p>Adjust the sliders to set the dirtiness and load size, then calculate the optimal washing time.</p>
        </header>

        <div class="controls">
            <div class="slider-group">
                <label for="dirtiness"><i class="fas fa-soap"></i> Dirtiness (0-100): <span id="dirtiness-value">{{ dirtiness_val }}</span></label>
                <input type="range" id="dirtiness" name="dirtiness" min="0" max="100" value="{{ dirtiness_val }}" class="slider">
            </div>

            <div class="slider-group">
                <label for="load"><i class="fas fa-weight-hanging"></i> Load Size (0-100): <span id="load-value">{{ load_val }}</span></label>
                <input type="range" id="load" name="load" min="0" max="100" value="{{ load_val }}" class="slider">
            </div>

            <button id="calculate-btn"><i class="fas fa-calculator"></i> Calculate Wash Time</button>
        </div>

        <div id="results-area" class="results">
             <!-- Results will be loaded here by JavaScript -->
             <h2>Recommended Wash Time:</h2>
             <p id="wash-time-output">-- minutes</p>
             <div id="plot-container">
                <h3>Fuzzy Output Distribution:</h3>
                <img id="output-plot" src="{{ url_for('static', filename='images/placeholder.png') }}" alt="Washing Time Output Distribution" style="display: none;">
                <p id="plot-placeholder">Adjust sliders and click calculate to see the plot.</p>
             </div>
        </div>

       <!-- <div class="membership-functions">
             <h2>Membership Functions</h2>
             <div class="mf-plot" id="mf-dirtiness">Loading Dirtiness MF plot...</div>
             <div class="mf-plot" id="mf-load">Loading Load MF plot...</div>
             <div class="mf-plot" id="mf-time">Loading Time MF plot...</div>
        </div>  -->


    </div> <!-- /container -->

    <footer>
        <p>Fuzzy Logic Demo</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
